# kilocode_change - new file
name: Windows startup benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - packages/opencode/bin/kilo
      - packages/opencode/script/kilocode/windows-startup.mjs
      - .github/workflows/windows-startup.yml

permissions:
  contents: read

concurrency:
  group: windows-startup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'investigate-windows-startup-performance'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "25.2.1"
      - name: Fetch baseline launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin $env:BASE_SHA
      - name: Compare published Windows CLI startup
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCHMARK_OUT: ${{ runner.temp }}/windows-startup-results
        run: node packages/opencode/script/kilocode/windows-startup.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-startup-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-startup-results
          if-no-files-found: error
          retention-days: 30
